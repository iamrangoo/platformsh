# Each route describes how an incoming URL is going to be processed by Platform.sh.
"https://{default}/":
    type: upstream
    upstream: "app:http"
    cache:
        enabled: false

"https://{default}/web2":
    type: upstream
    upstream: "app2:http"
    cache:
        enabled: false

"https://uat.manufacturing.stalk.exchange/yada/":
    type: upstream
    upstream: "app:http"
    cache:
        enabled: false